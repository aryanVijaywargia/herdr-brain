# The ci workflow is disabled until the GitHub Actions minutes reset on
# 1 Oct 2026 00:00 UTC. This workflow turns ci back on after the reset and
# starts one ci run on main. Delete this file after 1 Oct 2026.
name: ci-reenable
on:
  schedule:
    - cron: '20 0 1 10 *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  reenable:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow enable ci.yml --repo "$GITHUB_REPOSITORY"
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
