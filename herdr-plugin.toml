# Herdr Brain plugin manifest. Docs: https://herdr.dev/docs/plugins/
# Later epics add their own [[actions]] and [[panes]] (review pane: E5).
id = "brain"
name = "Herdr Brain"
version = "0.0.1"
min_herdr_version = "0.9.1"
description = "Cross-harness memory for coding agents in herdr (temporary name)"
platforms = ["linux", "macos"]

# Runs only on `herdr plugin install`. `herdr plugin link` skips it: run scripts/build.sh first.
[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "status"
title = "Brain: status"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" status"]

# First run (E1-S2): opens the setup pane, so a new user needs no `brain` on PATH.
# Also: `herdr plugin action invoke brain.setup`.
[[actions]]
id = "setup"
title = "Brain: setup"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint setup"]

# Placement: popup is the simpler choice until E5 decides popup or split [NEW].
[[panes]]
id = "setup"
title = "Brain setup"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" setup"]

# D4 (E2-S6): a close marks the workspace closed, because herdr reuses a closed id after a
# restart. herdr runs the command once for each event; there is no listener process.
[[events]]
on = "workspace.closed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" event workspace-closed"]
