# Herdr Brain plugin manifest. Docs: https://herdr.dev/docs/plugins/
# Later epics add their own [[actions]] and [[panes]].
id = "brain"
name = "Herdr Brain"
version = "0.2.0"
min_herdr_version = "0.9.1"
description = "Cross-harness memory for coding agents in herdr"
platforms = ["linux", "macos"]

# Runs only on `herdr plugin install`. `herdr plugin link` skips it: run scripts/build.sh first.
[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "status"
title = "Brain: status"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" status"]

# First run (E1-S2): opens the setup pane, so a new user needs no `brain` on PATH.
# Also: `herdr plugin action invoke brain.setup`.
[[actions]]
id = "setup"
title = "Brain: setup"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint setup"]

# E5-S3: setup stays a popup; `brain setup` resolves no caller, so it needs no pane id.
[[panes]]
id = "setup"
title = "Brain setup"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" setup"]

# E19-S3: starts brained for this herdr session when none holds the brained lock, points a stale
# ~/.local/bin/brain link of setup to this binary (#459), then opens the setup popup when the
# session has no binding; with no workspace, brained opens it once one exists (#462). herdr runs
# [[startup]] only after a session restore, so scripts/build.sh invokes this action after
# `herdr plugin install`.
# Also: `herdr plugin action invoke brain.start`.
[[actions]]
id = "start"
title = "Brain: start"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" start"]

# E5-S3: opens the queue of the focused pane's workspace in a split beside that pane.
# Also: `herdr plugin action invoke brain.review`.
[[actions]]
id = "review"
title = "Brain: review"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint queue"]

# Split, not popup. A popup has no HERDR_PANE_ID, so `brain review` cannot resolve the
# caller in it. `brain review` prints and exits, and the pane closes on exit, so the pane
# waits for Enter. The E5-S1 review pane is a separate entry.
[[panes]]
id = "queue"
title = "Brain queue"
placement = "split"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/brain\" review; printf 'Press Enter to close.'; read -r _"]

# E5-S1: the review pane of one proposal. E5-S2 opens it beside the caller with
# `plugin pane open --plugin brain --entrypoint review --no-focus --env BRAIN_PROPOSAL_ID=<id>`,
# so the id comes from --env, never from pane text. The pane closes when brain exits. Keep the
# exec: a close checks that herdr shows `brain pane review --proposal <id>` in the pane.
[[panes]]
id = "review"
title = "Brain review"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" pane review --proposal \"$BRAIN_PROPOSAL_ID\""]

# E20-S3: the recall popup searches the approved items of the focused pane's workspace and the
# global items, as `brain recall` does, and shows one item with its source excerpts. It only
# reads. Also: `herdr plugin action invoke brain.recall`.
[[actions]]
id = "recall"
title = "Brain: recall"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint recall"]

# A popup has no HERDR_PANE_ID, so `brain pane recall` takes the focused pane and its
# workspace from HERDR_PLUGIN_CONTEXT_JSON, and herdr confirms that pane as for any call.
[[panes]]
id = "recall"
title = "Brain recall"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" pane recall"]

# E20-S11: the popup lists the retired items and the archive candidates of the focused pane's
# workspace and the global items, as key i of the review pane does (E20-S7), with no proposal.
# Also: `herdr plugin action invoke brain.retired`.
[[actions]]
id = "retired"
title = "Brain: retired items"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint retired"]

# A popup, as the recall popup: `brain pane retired` takes the focused pane and its workspace
# from HERDR_PLUGIN_CONTEXT_JSON. q closes it.
[[panes]]
id = "retired"
title = "Brain retired items"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" pane retired"]

# #358: the popup lists the same_as links that wait for review in the focused pane's workspace
# and in global, as key m of the review pane does, with no proposal: m merges a link, n keeps it
# apart. Also: `herdr plugin action invoke brain.links`.
[[actions]]
id = "links"
title = "Brain: links to review"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint links"]

# A popup, as the retired popup: `brain pane links` takes the focused pane and its workspace
# from HERDR_PLUGIN_CONTEXT_JSON. q closes it.
[[panes]]
id = "links"
title = "Brain links to review"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" pane links"]

# E24-S7: `brain new-pane` splits the focused pane, in the cwd of that pane, and types
# `brain claude` or `brain codex` into the new pane's shell. The pane keeps its shell after the
# CLI exits, so the "resume with" line stays. Also: `herdr plugin action invoke brain.claude`
# and `brain.codex`.
[[actions]]
id = "claude"
title = "Brain: new Claude pane"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" new-pane claude"]

[[actions]]
id = "codex"
title = "Brain: new Codex pane"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" new-pane codex"]

# E2-S6: a close marks the workspace closed, because herdr reuses a closed id after a
# restart. herdr runs the command once for each event; there is no listener process.
[[events]]
on = "workspace.closed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" event workspace-closed"]

# E11-S2: herdr starts brained once for each herdr session, after its socket is ready.
# herdr does not supervise it: brained exits on the end of the event socket, and when Brain
# is disabled or unlinked. A lock in HERDR_PLUGIN_STATE_DIR keeps one brained per session. herdr
# does not run this again after a reinstall: brained itself runs the binary of the plugin root
# that herdr lists (#468).
[[startup]]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" brained"]
