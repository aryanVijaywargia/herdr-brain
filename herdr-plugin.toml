# Herdr Brain plugin manifest. Docs: https://herdr.dev/docs/plugins/
# Later epics add their own [[actions]] and [[panes]].
id = "brain"
name = "Herdr Brain"
version = "0.0.1"
min_herdr_version = "0.9.1"
description = "Cross-harness memory for coding agents in herdr (temporary name)"
platforms = ["linux", "macos"]

# Runs only on `herdr plugin install`. `herdr plugin link` skips it: run scripts/build.sh first.
[[build]]
command = ["sh", "scripts/build.sh"]

[[actions]]
id = "status"
title = "Brain: status"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" status"]

# First run (E1-S2): opens the setup pane, so a new user needs no `brain` on PATH.
# Also: `herdr plugin action invoke brain.setup`.
[[actions]]
id = "setup"
title = "Brain: setup"
contexts = ["global", "workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint setup"]

# D6 (E5-S3): setup stays a popup; `brain setup` resolves no caller, so it needs no pane id.
[[panes]]
id = "setup"
title = "Brain setup"
placement = "popup"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" setup"]

# E5-S3 (D6): opens the queue of the focused pane's workspace in a split beside that pane.
# Also: `herdr plugin action invoke brain.review`.
[[actions]]
id = "review"
title = "Brain: review"
contexts = ["workspace", "pane"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin brain --entrypoint queue"]

# D6: split, not popup. A popup has no HERDR_PANE_ID, so `brain review` cannot resolve the
# caller in it. `brain review` prints and exits, and the pane closes on exit, so the pane
# waits for Enter. The E5-S1 review pane is a separate entry.
[[panes]]
id = "queue"
title = "Brain queue"
placement = "split"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/bin/brain\" review; printf 'Press Enter to close.'; read -r _"]

# E5-S1: the review pane of one proposal. E5-S2 opens it beside the caller with
# `plugin pane open --plugin brain --entrypoint review --no-focus --env BRAIN_PROPOSAL_ID=<id>`,
# so the id comes from --env, never from pane text. The pane closes when brain exits.
[[panes]]
id = "review"
title = "Brain review"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" pane review --proposal \"$BRAIN_PROPOSAL_ID\""]

# D4 (E2-S6): a close marks the workspace closed, because herdr reuses a closed id after a
# restart. herdr runs the command once for each event; there is no listener process.
[[events]]
on = "workspace.closed"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/brain\" event workspace-closed"]
