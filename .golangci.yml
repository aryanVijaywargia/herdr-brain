# golangci-lint v2. This config enforces the repo's Go rules: errors handled once and wrapped, no
# dropped errors, small flat functions, no dead code, and comments that say why.
# The thresholds are the project's own choice.
version: "2"

linters:
  enable:
    - errcheck
    - errorlint
    - nilerr
    - staticcheck
    - unused
    - unparam
    - dupl
    - revive
    - gocritic
    - nestif
    - funlen
    - forcetypeassert
  settings:
    funlen:
      lines: -1 # count statements, not lines, so long test tables pass
      statements: 40 # short functions
    dupl:
      threshold: 150 # tokens; only large copies: extract at the third copy
    nestif:
      min-complexity: 5 # flat functions
  exclusions:
    rules:
      # cmd/ prints to the user's terminal, and a failed write there has no one to report to.
      # fmt.Fprint* in other packages, and every Close, stay checked.
      - path: ^cmd/
        linters: [errcheck]
        text: "Error return value of `fmt\\.Fprint(f|ln)?` is not checked"

issues:
  # Show every finding in one run, not the first 50 per linter or 3 per message.
  max-issues-per-linter: 0
  max-same-issues: 0
