# Labeled prompt set (HLD §12.1 "Labeled prompt set", S71, E14-S2). Go tests of Brain's own
# matcher load this file: internal/store/promptset_test.go. No agent and no model.
#
# [[proposal]]: a fixture proposal and its trigger prompts. The test stores each trigger
# prompt as a prompt observation with its prompt index row in the workspace of the proposal,
# and proposes it in its scope ("workspace" or "global").
#
# [[prompt]]: a prompt with its label: the expected proposal id, or "no match". S71 checks
# that each one gives its label with exact match only. kind is one of: repeat, language,
# unicode, everyday, negation, arguments, repo, unrelated. A negation or arguments case
# names the proposal that it tests in proposal; each proposal has both. No proposal has a
# parameter, so other arguments are "no match".
#
# [[near]]: a repeat with a small change (case, punctuation, a polite word) that exact match
# cannot see. Only a close matcher can give its label. Exact match must give no match.
#
# part splits the set [NEW]: a close-match threshold comes from "tune" and is checked on
# "held-out" (§12.1). The Unicode cases follow the three kinds of waku
# waku/memory/semantic/store.py:31-64: text with no spaces, accents and command punctuation.
# The workspace of a case is "ws-A" when it has none; "" is a workspace with no Brain key.

[[proposal]]
id = "make-test"
scope = "workspace"
workspace = "ws-A"
triggers = ["run make test and fix the failures"]

[[proposal]]
id = "pnpm"
scope = "global"
workspace = "ws-A"
triggers = ["use pnpm, not npm, when you install packages", "use pnpm not npm to install packages"]

[[proposal]]
id = "migrate"
scope = "workspace"
workspace = "ws-A"
triggers = ["run the database migrations before you start the server"]

[[proposal]]
id = "deploy-staging"
scope = "workspace"
workspace = "ws-B"
triggers = ["deploy the api service to the staging cluster and run the smoke tests"]

[[proposal]]
id = "ja-commit"
scope = "global"
workspace = "ws-A"
triggers = ["テストを実行してからコミットして"]

[[proposal]]
id = "es-lint"
scope = "workspace"
workspace = "ws-A"
triggers = ["ejecuta el linter antes de hacer commit"]

[[proposal]]
id = "cafe-notes"
scope = "global"
workspace = "ws-A"
triggers = ["résumé the café notes"]

[[proposal]]
id = "push-lease"
scope = "workspace"
workspace = "ws-A"
triggers = ['git commit -m "fix: x" && git push --force-with-lease']

[[proposal]]
id = "zh-docs"
scope = "global"
workspace = "ws-A"
triggers = ["更新文档然后提交"]

[[proposal]]
id = "de-format"
scope = "workspace"
workspace = "ws-B"
triggers = ["formatiere den Code mit gofmt bevor du committest"]

# Real repeats.

