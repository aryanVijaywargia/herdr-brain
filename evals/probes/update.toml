# Update probes (E10-S3): you approve a change of an item; a fresh session must give the new
# revision, not the old one.

[[probe]]
id = "update-edit"
stage = "update"
source = "synthetic marker"
setup = [
  'brain remember "The deploy code word of this workspace is {{marker}}."',
  "brain review 1 --approve",
  'brain review --item 1 --edit "The deploy code word of this workspace is {{marker2}}."',
  "brain review 2 --approve",
]
expect_revision = 2
ask = "What is the deploy code word of this workspace? Answer with the code word only."
expect = ["{{marker2}}"]
stale = ["{{marker}}"]
harnesses = ["claude", "codex"]
