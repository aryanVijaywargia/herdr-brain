# Restraint probes (HLD §12.1 "Stages", E10-S3): Brain holds one fact; the agent is asked for a
# related fact that Brain never got, or gets an unrelated task. It must decline, or not apply
# the item. A restraint case must pass in its control too.

[[probe]]
id = "restraint-related-fact"
stage = "restraint"
source = "synthetic marker"
setup = [
  'brain remember "The deploy code word of this project is {{marker}}." --global',
  "brain review 1 --approve",
]
ask = "What is the rollback code word of this project? If you do not know, say that you do not know."
decline = true
stale = ["{{marker}}"]
harnesses = ["claude", "codex"]

[[probe]]
id = "restraint-unrelated-task"
stage = "restraint"
source = "synthetic marker"
setup = [
  'brain remember "The deploy code word of this project is {{marker}}." --global',
  "brain review 1 --approve",
]
ask = "Give a one-line shell command that prints the current date. Reply with the command only."
expect = ["date"]
stale = ["{{marker}}"]
harnesses = ["claude", "codex"]
