# Regression cases (E20-S1 #265): each bug that real use found gets its own case, named with its
# issue number (bug-<issue>), so one fix cannot hide another failure and a bug cannot come back
# in silence. The bugs come from the M2 real-use test, the M2 eval run (2026-10-07), its rerun
# (2026-10-08) and the reviews of their fixes.
#
# A case runs the Go tests that hold the fixture of its bug: the made screens, hook inputs,
# fake herdr replies and stores that the fix added. brain-eval runs them with go test in the
# repo and prints one pass or fail line for the case. A case needs no herdr, no CLI and no
# model, so it has no control. Run it from the repo root:
#   go run ./cmd/brain-eval --probes evals/probes --stage regression
#
# tests: "<package folder>:<test name>", the name as `go test -v` prints it, with its subtests.
# The comment above each case names the bug and the pull request of its fix.

# Workspace ids with letters (w1N) break every Brain command. Fix: PR #248.
[[bug]]
issue = 247
tests = ["internal/herdr:TestLetterIDs", "internal/cli:TestStatusLetterWorkspaceID"]

