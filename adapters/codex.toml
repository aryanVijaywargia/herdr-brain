# Codex CLI profile (HLD §8.5). M1 fields only.
kind = "codex"
# The user hooks file; trust keys use this path (spike/m0/FINDINGS.md, E8-S3).
install_target = "~/.codex/hooks.json"
# Codex 0.154 fires SessionStart at the first prompt, not at start (M0 item 1).
events.start = "SessionStart"
# Hook records (E11-S5, §6.1): on after the live hook test on codex-cli 0.160.1 (#285,
# spike/m0/data/e11s1c-codex-hooks.txt). Codex has no failure event: PostToolUse also fires for
# a command that fails. Every tool fires PostToolUse, MCP tools too, and only the shell tool
# has a command, so the tool hook runs only for "Bash". The Stop hook gives the stop record;
# `notify` is not a Brain source. Each new hook entry needs Codex trust again.
events.prompt = "UserPromptSubmit"
events.tool = ["PostToolUse"]
events.tool_matcher = "Bash"
events.stop = "Stop"
start_condition = ""
output_form = "hookSpecificOutput.additionalContext"
input.session_id = "session_id"
input.cwd = "cwd"
# The start input names the CLI's transcript file; Brain stores the path in the receipt and
# never reads the file (E15-S4, spike/m0/data/e11s1-codex-hooks.txt).
input.transcript_path = "transcript_path"
# The hook record paths (live on codex-cli 0.160.1, #285). The prompt is the text as typed: an
# @-mention stays "@file", and a hook with no output leaves the prompt unchanged. The shell
# command is the whole command string, also for a long command. The cwd is the turn cwd: a
# `cd` in the command and the workdir of the tool call do not change it. PostToolUse has no
# exit status. The Stop reply is the final reply text; the Codex source says it can be null.
# A turn that you stop with Esc fires no Stop and no PostToolUse.
input.prompt = "prompt"
input.command = "tool_input.command"
input.reply = "last_assistant_message"
# Codex runs a new or changed hook entry only after you trust it (E8-S3): setup shows the
# steps, and brain doctor checks the trust state.
hook_trust = "codex"
# Codex asks at start whether to trust a new folder, and the eval runner never answers that
# dialog; so a fresh Codex gets the trust of the scratch folder on its command line only, never
# in ~/.codex/config.toml. The key is a quoted TOML key, because Codex splits a dotted -c key at
# each dot (E10-S3).
eval.args = ['-c', 'projects={{{dir}}={trust_level="trusted"}}', '-c', 'check_for_update_on_startup=false']
# The version of the M0 test (spike/m0/FINDINGS.md).
tested_version = "0.154.0"
# The hook entry sets additionalContextLimit 0, so Codex sends the whole brief inline, not a
# preview of a saved file (E8 epic, official Codex hooks docs).
additional_context_limit = 0
# The Codex screen lines that change on each read and that herdr capture drops (§6.2, E11-S4):
# the empty composer, the footer, the spinner and the rules. From the recorded reads in
# internal/brained/testdata (codex-cli 0.154.0). The footer starts with the git branch, so the
# pattern takes any text before " · Context".
noise_lines = ['› Ask Codex to do anything', '\s*.* · Context \d+% (?:used|left) · .*', '• Working \(.*\)', '─+',
# Codex 0.160.1 (#281, M2 eval run 2026-10-07): the approval echo line, the footer of the model
# and the folder, the shortcut hint, and the fold hints of a code diff in the agent output. A
# diff line after a prompt line was stored as user text, and "don't" in an approval made a
# correction signal.
  '✔ You approved codex to .*', '  \S+ (?:minimal|low|medium|high|xhigh) · [~/].*', '\s*\? for shortcuts.*',
  '\s+\+ Show details', '\s+\+ \d+ lines? \(ctrl\+t to expand\)', '\s+⋮',
# Codex 0.160.1 (#291, M2 eval run): the tip line under a tree mark. It was stored as user text.
  '\s*└ Tip: .*',
# The choices of an approval dialog: the first one has the prompt mark, and "don't" made a
# correction signal. The question, the reason and the command stay: the blocked approval
# signal reads them (§7.1).
  '(?:›| ) \d\. (?:Yes, proceed|Yes, and don.t ask again|No, and tell Codex) .*', '  Press enter to confirm or esc to cancel',
# Codex 0.160.1 (#316, M2 eval rerun 2026-10-08): the line of a turn that you stop, and the
# shell prompt line that started Codex above its banner, also a bare "$ codex". They were
# stored as user text, and "wrong" made a correction signal. A prompt starts with ›, so a
# prompt with the same words stays.
  '■ Conversation interrupted - .*', '(?:[^\s›•].*[%$#>❯]|[$%]) (?:\S+/)?codex(?: .*)?',
# Codex 0.160.1 (#338, M2 eval run 3 2026-10-09): the two lines that Codex prints when it ends,
# with the texts of the Codex source (tui/src/main.rs, protocol TokenUsage). The pane keeps them,
# so each later session in the pane reads them again at its start. They were stored as user text.
# The report shows "run:" with a colon and the source "run" with none, so both match.
  'Token usage: total=[\d,]+ input=.*', 'To continue this session, run:? codex resume .*']
# The start banner (#258): the box with the version, model and folder, and the tip lines under
# it, also when a tip wraps. A tip line at another place is text of a reply.
# Codex 0.160.1 (#278, #281, M2 eval run): the start banner with no box (the version, the folder,
# a welcome line and the logo), and the folder trust dialog. Each runs to the next line at
# column 0 that is not one of its options. A blank line ends a block, unless its next matches
# the empty line: the empty last choice of next keeps the block open over it (#291).
noise_blocks = [
  { start = '╭─+╮', next = '[│╰].*|  \S.*|' },
  { start = '\s*>_ OpenAI Codex \(v\S+\)', next = '  .*|' },
  { start = '  Folder access', next = '  .*|› \d\. Trust .*|' },
  # The lines of a code diff in the agent output (#281): a line number, then +, - or a space.
  # A long diff line wraps onto a line with no number (#291); its text, such as "error:", made
  # a failure signal under the tool mark. [NEW: no wrap is recorded] The number takes at least
  # 6 columns before the +, so a wrapped line starts at column 7 or more; the tool output
  # under └ starts at column 4. A fold hint keeps the block open, and a blank line ends it.
  { start = '\s{4,}\d+ [-+ ].*', next = '\s{7,}\S.*|\s+⋮' },
  # Codex 0.160.1 (#316, M2 eval rerun): the start dialog "Hooks need review" and the /hooks
  # views (the table of the events and the hooks of one event), with the texts of the Codex
  # source (tui/src/startup_hooks_review.rs, tui/src/bottom_pane/hooks_browser_view.rs). The
  # first choice of the dialog has the prompt mark. Codex cuts a line of these views at the
  # pane edge, so a pattern takes the start of a line. A long command of a hook wraps to
  # column 12 [NEW: the snapshots of the Codex source]. Both blocks start under a blank line:
  # a prompt line with the same words is right under the prompt, so it stays.
  { start = '  Hooks need review', next = '  .*|› \d\. (?:Review hooks|Trust all and continue|Continue without trusting.*)|', after_blank = true },
  { start = '  (?:Hooks|(?:PreToolUse|PermissionRequest|PostToolUse|PreCompact|PostCompact|SessionStart|SessionEnd|UserPromptSubmit|SubagentStart|SubagentStop|Stop) hooks)', next = '''  (?:Lifecycle hooks.*|Turn hooks on or off.*|Issues|[⚠■] .*|\d+ hooks? needs? review.*|No hooks installed.*|[A-Z][A-Za-z]+ +\d+(?: .*)?|\[[x !]\] .*|(?:Event|Matcher|Source|Command|Timeout|Context|Trust)(?: +\S.*)?|Managed hooks.*|Press .*)|\s{12}\S.*|''', after_blank = true },
  # The line of a request that you cancel, and the rest of its command on the next lines.
  { start = '✗ You canceled the request .*', next = '  \S.*' },
]
