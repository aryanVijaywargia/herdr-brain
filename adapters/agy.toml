# agy profile, from the agy 1.2.16 facts (E16-S2 test) and the live E16-S12 check. The base
# adapter runs it with no Go code of its own.
kind = "agy"
# The user hooks file. Each named hook is one root key of the file; Brain's key is
# "brain". PreInvocation is a flat handler, and PostToolUse a matcher group around its handlers.
install_target = "~/.gemini/config/hooks.json"
hooks_key = "brain"
flat_handlers = true
# agy has no pure start event: it runs PreInvocation before each model call (E16-S2).
events.start = "PreInvocation"
# Hook records (E11-S5): the shell tool only. The input has the command line and no exit
# status. agy's Stop input has no reply text, so the stop record stays off (E16-S2).
events.tool = ["PostToolUse"]
events.tool_matcher = "run_command"
# invocationNum is 0 at the start of each turn, and initialNumSteps is 1 only at the first turn
# of a conversation.
start_condition = "invocationNum == 0 && initialNumSteps == 1"
output_form = "injectSteps[0].ephemeralMessage"
# agy reads JSON on each hook run, so a run that delivers nothing prints "{}" (E16-S2).
output_none = "{}"
input.session_id = "conversationId"
input.cwd = "workspacePaths[0]"
# Brain stores the transcript path in the receipt and never reads the file (E15-S4).
input.transcript_path = "transcriptPath"
input.command = "toolCall.args.CommandLine"
# agy trusts folders by exact path and asks again in each new folder, with no flag to skip that
# (agy --help, 1.2.16). The eval runner runs agy cases in this one fixed folder, emptied before
# each case; the M3 exit run (#165) trusts it once by hand.
eval.dir = "/tmp/brain-eval-agy"
# The version of the E16-S12 check (`agy --version`). agy updates itself.
tested_version = "1.2.16"
# The agy screen lines that change on each read and that herdr capture drops (E11-S4):
# the braille spinner, the tip, the empty prompt, the rules, the footer, the cancel line and the
# thought summary. From the live E16-S12 check (agy 1.2.16). agy draws inline, not in the
# alternate screen.
noise_lines = [
  '\s*[\x{2800}-\x{28FF}]\s+.*',
  '\s*└ Tip: .*',
  '\s*>\s*',
  '─+',
  '\s*\? for shortcuts.*',
  '\s*esc to cancel.*',
  '\s*▸ Thought for .*',
]
