# Claude Code profile (HLD §8.5). M1 fields only.
kind = "claude"
# The user settings file (E8 epic, M0 item 1).
install_target = "~/.claude/settings.json"
# Claude also runs SessionStart after resume, clear and compact; Brain delivers then too (§8.3).
events.start = "SessionStart"
# Hook records (E11-S5, §6.1): on after the E11-S1 live hook test on Claude Code 2.1.284
# (spike/m0/data/e11s1-claude-hooks.txt). A failed command comes in PostToolUseFailure, so both
# tool events run `brain hook --event tool`, only for the shell tool.
events.prompt = "UserPromptSubmit"
events.tool = ["PostToolUse", "PostToolUseFailure"]
events.tool_matcher = "Bash"
events.stop = "Stop"
start_condition = ""
output_form = "hookSpecificOutput.additionalContext"
input.session_id = "session_id"
input.cwd = "cwd"
# The start input names the CLI's transcript file; Brain stores the path in the receipt and
# never reads the file (E15-S4, spike/m0/data/e11s1-claude-hooks.txt).
input.transcript_path = "transcript_path"
input.prompt = "prompt"
input.command = "tool_input.command"
# PostToolUseFailure only: "Exit code N" and the output. PostToolUse has no exit status.
input.error = "error"
input.exit_pattern = '^Exit code (\d+)'
input.reply = "last_assistant_message"
# Claude draws in the alternate screen: the eval runner reads its visible screen (E11-S1).
alt_screen = true
# A setup agent of the eval runner may run `brain remember` with no ask (E10-S3).
eval.setup_args = ["--allowedTools", "Bash(brain remember:*)"]
# The version of the M0 test (spike/m0/FINDINGS.md).
tested_version = "2.1.283"
# The Claude screen lines that change on each read and that herdr capture drops (§6.2, E11-S4):
# the spinner, the done line of a turn, the empty prompt box, the rules, the status
# line and the mode line.
# From the recorded reads in internal/brained/testdata (Claude Code 2.1.284). The status line
# " | ctx:" is the one of the recording machine.
# Claude Code 2.1.292 (#258, real-use test 2026-10-07, made fixtures in
# internal/adapter/testdata/screen): the rows of the start logo (logo, version, model and plan,
# folder), the mode line of another mode and the shortcut hint.
noise_lines = ['[·✢✳✶✻✽*] \S+….*', '[·✢✳✶✻✽*] \S+ for .* · done .*', '❯', '.* \| ctx:.*', '\s*⏸ .*',
  '\s*[▐▛▜▌▝▘▗▖▙▟▀▄█][▐▛▜▌▝▘▗▖▙▟▀▄█ ]*\s{2,}.*', '\s*⏵⏵ .*', '\s*\? for shortcuts.*',
# Claude Code 2.1.292 (#281, M2 eval run 2026-10-07): the cut mark of a code diff in the agent
# output, and the folded shell commands. Under a prompt they were stored as user text.
  '\s{4,}\.\.\.', '  Ran \d+ shell commands?(?:, .*)?',
# Claude Code 2.1.292 (#291, M2 eval run): an announcement line, and the effort line at the
# right of the prompt box (spike/m0/e17s2/data/screens.txt) for each effort. They were stored
# as user text.
  '\s*▎ .*', '\s*[○◔◐◑◕●] \S+ · /effort']
# The screen parts of more than one line (#258): a tip, also when it wraps in a narrow column,
# and the welcome box with its two columns. Claude 2.1.284 puts a no-break space before "Tip:"
# (internal/brained/testdata/claude-s31-0-base.txt). A blank line ends a block, unless its next
# matches the empty line: the empty last choice of next keeps the block open over it (#291).
noise_blocks = [
  { start = '\s*⎿[\s\x{a0}]+Tip: .*', next = '\s{5}\S.*|' },
  # A rule, and the placeholder of the empty prompt box under it (#291, M2 eval run). The
  # placeholder was stored as user text. A sent prompt with the same text has no rule above it,
  # so it stays.
  { start = '─+', next = '❯ Try "[^"]*"' },
  # The lines of a code diff in the agent output (#281): a line number, then +, - or a space.
  # A long diff line wraps onto a line with no number (#291); its text, such as "error:", made
  # a failure signal under the tool mark. [NEW: no wrap is recorded] The number takes at least
  # 8 columns before the +, so a wrapped line starts at column 8 or more; the tool output
  # under ⎿ starts at column 5. A cut mark keeps the block open, and a blank line ends it.
  { start = '\s{4,}\d+ [-+ ].*', next = '\s{8,}\S.*|\s{4,}\.\.\.' },
  { start = '\s*╭─+ Claude Code .*╮', next = '\s*[│╰].*|' },
  # The folder trust dialog of Claude Code 2.1.292 (#281, M2 eval run): its lines start with
  # one space, and its choices come after the ❯ cursor or under it. A wrapped line starts in
  # lower case. The lines are named, so the question of an approval dialog at the top of a
  # read stays (§7.1).
  { start = '\s*Accessing workspace:', next = ''' (?:[~/]\S*|Quick safety check: .*|Claude Code'll be able to .*|Security guide|Enter to confirm · Esc to cancel|[a-z(].*)| ?(?:❯| ) +(?:No, exit|Yes, I trust this folder)|''' },
]
# The diff panel (/diff, Claude Code 2.1.260 and later) opens beside the conversation in a
# terminal at least 110 columns wide; its header is "N files changed +A -D" (#258). The header
# takes a divider glyph before it too, so the cut drops the divider [NEW: the divider is not
# recorded]. [NEW] The conversation keeps at least 40 columns.
side_panel = { header = '(?:[│┃] +)?\d+ files? changed \+\d+ [-−]\d+', min_column = 40 }
